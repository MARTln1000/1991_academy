# Every push runs the API tests and builds + smoke-tests the Docker image
# (docker-compose.yml). A push to master that passes the tests is deployed
# to the production server by deploy/deploy.sh. README.md → "Deploy" covers the
# one-time setup: the server itself, then these repository settings
# (Settings → Secrets and variables → Actions):
#
#   Variables  DEPLOY_HOST          server address. While it is unset the deploy
#                                   job is skipped, so this file is safe to push
#                                   before a server exists.
#              ACADEMY_URL          public origin, e.g. https://academy.example.com
#              DEPLOY_USER          optional, default "deploy"
#              DEPLOY_PORT          optional, default 22
#   Secrets    DEPLOY_SSH_KEY       private key whose public half setup-server.sh authorized
#              DEPLOY_KNOWN_HOSTS   output of `ssh-keyscan <DEPLOY_HOST>`; pins the server's host key
name: Test & Deploy

on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to deploy. Blank means the branch chosen above; an older commit is a rollback.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A new push to a feature branch cancels that branch's older test run; runs
  # that may deploy (master, manual) are never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what Ubuntu 24.04 runs in production; 3.14 is the dev machine.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
      - name: Install dependencies (pinned by requirements.lock)
        run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Run the API tests
        run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build and start the app container (docker-compose.yml)
        run: REVISION=$(git rev-parse HEAD) docker compose up -d --build --wait app
      - name: Smoke test
        run: |
          health=$(curl -fsS http://127.0.0.1:8735/api/health)
          echo "$health"
          # production settings, and the commit that was just built
          python3 -c 'import json, sys
          h = json.loads(sys.argv[1])
          assert h["ok"] is True and h["revision"] == sys.argv[2], h
          assert not h["debug"] and not h["cpp"] and h["secure_cookies"] and h["trust_proxy"], h' \
            "$health" "$(git rev-parse HEAD)"
          curl -fsS -o /dev/null http://127.0.0.1:8735/            # the frontend is served
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8735/app.py)
          [ "$code" = 404 ] || { echo "/app.py answered $code, expected 404"; exit 1; }
          make backup                                             # sqlite3 in the image, read-only container
          ls -l backups/
      - name: Container log
        if: always()
        run: docker compose logs app

  deploy:
    name: Deploy to production
    needs: test
    if: >-
      vars.DEPLOY_HOST != '' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.ACADEMY_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ACADEMY_URL: ${{ vars.ACADEMY_URL }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          missing=""
          [ -n "$SSH_KEY" ] || missing="$missing secret:DEPLOY_SSH_KEY"
          [ -n "$KNOWN_HOSTS" ] || missing="$missing secret:DEPLOY_KNOWN_HOSTS"
          [ -n "$ACADEMY_URL" ] || missing="$missing variable:ACADEMY_URL"
          if [ -n "$missing" ]; then
            echo "::error::Deploy settings missing:$missing (README.md → Deploy → One-time setup)"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          EOF
      - name: Deploy
        env:
          ACADEMY_URL: ${{ vars.ACADEMY_URL }}
        run: deploy/deploy.sh production

# Local override (applied by the Makefile when DOMAIN is empty): plain HTTP on
# http://localhost:8735, no Caddy.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d app
services:
  app:
    environment:
      ACADEMY_SECURE_COOKIES: "0"   # plain HTTP
      ACADEMY_TRUST_PROXY: "0"      # no proxy
      ACADEMY_BASE_URL: http://localhost:8735

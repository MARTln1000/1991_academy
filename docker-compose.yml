# Production stack: app (API + frontend, SQLite in the `data` volume) and Caddy
# (TLS termination, automatic certificates). Use via the Makefile; with an
# empty DOMAIN, docker-compose.local.yml is layered on top for local use.
# See docs/deployment.md.

# Fixed project name so volume names do not depend on the checkout directory.
name: academy

x-logging: &logging
  # Cap container logs at 5 x 10 MB.
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  app:
    build:
      context: .
      args:
        REVISION: ${REVISION:-}
    image: 1991-academy
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Safe: the port is reachable only by Caddy and the host, and Caddy
      # overwrites X-Forwarded-For.
      ACADEMY_TRUST_PROXY: "1"
      ACADEMY_BASE_URL: https://${DOMAIN:-localhost}
    volumes:
      - data:/data
      - ${MEDIA_DIR:-./media}:/media:ro
    ports:
      # Loopback only. Publishing on 0.0.0.0 would bypass the host firewall
      # and allow X-Forwarded-For spoofing.
      - "127.0.0.1:8735:8735"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificates and ACME account
      - caddy-config:/config
      - ${MEDIA_DIR:-./media}:/srv/media:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging: *logging

volumes:
  data:          # academy.db and in-container backups
  caddy-data:
  caddy-config:
